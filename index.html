
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krism.AI | Dashboard de Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:italic,wght@400;500&display=swap" rel="stylesheet">
    <style>
      body { 
        font-family: 'Inter', sans-serif; 
        background-color: #05050A;
      }
      h1, h2, h3, h4, h5, h6 { font-family: 'Plus Jakarta Sans', sans-serif; }
      .font-serif-brand { font-family: 'Instrument Serif', serif; }
      
      /* Scrollbar Personalizado */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #05050A; }
      ::-webkit-scrollbar-thumb { background: #1f1f23; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #6366F1; }

      /* Animación Reveal */
      .reveal {
        opacity: 0;
        transform: translateY(30px);
        transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
      }
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }

      /* Efecto Hover Card */
      .hover-card {
        transition: all 0.3s ease;
      }
      .hover-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 40px -10px rgba(99, 102, 241, 0.3);
        border-color: rgba(99, 102, 241, 0.5);
      }

      .border-gradient {
        position: relative;
      }
      .border-gradient::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.2));
        pointer-events: none;
      }

      /* Input Autofill styling adjustment */
      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus, 
      input:-webkit-autofill:active{
          -webkit-box-shadow: 0 0 0 30px #05050A inset !important;
          -webkit-text-fill-color: white !important;
          transition: background-color 5000s ease-in-out 0s;
      }

      /* Custom Checkbox */
      .custom-checkbox {
        appearance: none;
        background-color: transparent;
        margin: 0;
        font: inherit;
        color: currentColor;
        width: 1.125rem;
        height: 1.125rem;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 0.25rem;
        display: grid;
        place-content: center;
        transition: all 0.2s;
        cursor: pointer;
      }
      .custom-checkbox::before {
        content: "";
        width: 0.65em;
        height: 0.65em;
        transform: scale(0);
        transition: 120ms transform ease-in-out;
        box-shadow: inset 1em 1em white;
        transform-origin: center;
        clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
      }
      .custom-checkbox:checked {
        background-color: rgba(45, 212, 191, 0.1);
        border-color: #2DD4BF;
      }
      .custom-checkbox:checked::before {
        transform: scale(1);
        box-shadow: inset 1em 1em #2DD4BF;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              page: '#05050A',
              surface: 'rgba(255, 255, 255, 0.03)',
              stroke: 'rgba(255, 255, 255, 0.08)',
              'stroke-strong': 'rgba(255, 255, 255, 0.15)',
              brand: {
                page: '#05050A',
                teal: '#2DD4BF',
                indigo: '#6366F1',
                dark: '#0F172A',
                blue: '#3b82f6',
                green: '#34d399'
              }
            },
            backgroundImage: {
              'glow-radial': 'radial-gradient(circle at 50% 0%, rgba(45, 212, 191, 0.1) 0%, rgba(5, 5, 10, 0) 70%)',
              'text-gradient': 'linear-gradient(90deg, #2DD4BF 0%, #3B82F6 50%, #818CF8 100%)',
              'logo-pill': 'linear-gradient(180deg, #172554 0%, #2563EB 100%)',
              'logo-circle': 'linear-gradient(135deg, #2DD4BF 0%, #34D399 100%)',
              'logo-quarter': 'linear-gradient(135deg, #3B82F6 0%, #6366F1 100%)'
            }
          }
        }
      }
    </script>
<script type="importmap">
{
  "imports": {

    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
